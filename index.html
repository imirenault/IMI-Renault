<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Gemini Flash Multi-Thread PWA</title>
 <link rel="manifest" href="manifest.json" />
 <meta name="theme-color" content="#111827" />
 <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
 <style>
 * { box-sizing: border-box; }
 body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100dvh; background: 
#f9fafb; color: #111827; }
 #sidebar { width: 260px; background: #111827; color: #f9fafb; display: flex; flex-direction: 
column; padding: 0.75rem; transition: transform 0.2s ease; z-index: 20; }
 #newChatBtn { background: #2563eb; color: #fff; border: none; padding: 0.7rem; border-radius: 
8px; font-weight: 600; cursor: pointer; margin-bottom: 0.75rem; width: 100%; }
 #threadList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; }
 .thread-item { display: flex; justify-content: space-between; align-items: center; padding: 
0.6rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; color: #d1d5db; }
 .thread-item:hover { background: #1f2937; }
 .thread-item.active { background: #374151; color: #fff; font-weight: 600; }
 .thread-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 0.5rem; }
 .del-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 
1rem; padding: 0 4px; }
 .del-btn:hover { color: #f87171; }
 #main { flex: 1; display: flex; flex-direction: column; max-width: 100%; height: 100dvh; }
 header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: 
#fff; border-bottom: 1px solid #e5e7eb; }
 #menuBtn { display: none; background: #f3f4f6; color: #111827; border: 1px solid #d1d5db; 
padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer; }
 #chatTitle { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: 
ellipsis; }
 #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 
0.75rem; max-width: 800px; width: 100%; margin: 0 auto; }
 .msg { padding: 0.75rem 1rem; border-radius: 10px; line-height: 1.5; max-width: 85%; word-wrap: 
break-word; }
 .user { background: #2563eb; color: #fff; align-self: flex-end; }
 .model { background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; }
 .model pre { background: #1f2937; color: #f9fafb; padding: 0.75rem; border-radius: 6px; overflow-x: auto; }
 .model code { font-family: monospace; }
 form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; background: #fff; border-top: 1px solid 
#e5e7eb; max-width: 800px; width: 100%; margin: 0 auto; }
 input { flex: 1; padding: 0.75rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 
8px; }
 #sendBtn { padding: 0.75rem 1.25rem; font-size: 1rem; border: none; border-radius: 8px; 
background: #2563eb; color: #fff; cursor: pointer; }
 #sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }
 @media (max-width: 700px) {
 #sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
 #sidebar.open { transform: translateX(0); }
 #menuBtn { display: inline-block; }
 }
 </style>
</head>
<body>
 <aside id="sidebar">
 <button id="newChatBtn" type="button">+ New Chat</button>
 <div id="threadList"></div>
 </aside>
 <main id="main">
 <header>
 <button id="menuBtn" type="button">☰</button>
 <h3 id="chatTitle">New Chat</h3>
 </header>
 <div id="chat"></div>
 <form id="chatForm">
 <input type="text" id="userInput" placeholder="Ask Gemini anything..." required />
 <button type="submit" id="sendBtn">Send</button>
 </form>
 </main>
 <script>
 if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js');
 }
 const WORKER_URL = "YOUR_CLOUDFLARE_WORKER_URL";
 const STORAGE_KEY = "gemini_pwa_threads_v1";
 const sidebar = document.getElementById('sidebar');
 const menuBtn = document.getElementById('menuBtn');
 const newChatBtn = document.getElementById('newChatBtn');
 const threadList = document.getElementById('threadList');
 const chatTitle = document.getElementById('chatTitle');
 const chatBox = document.getElementById('chat');
 const chatForm = document.getElementById('chatForm');
 const userInput = document.getElementById('userInput');
 const sendBtn = document.getElementById('sendBtn');
 let threads = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 let activeThreadId = threads[0]?.id || null;
 function saveThreads() {
 localStorage.setItem(STORAGE_KEY, JSON.stringify(threads));
 }
 function createThread() {
 const newThread = { id: Date.now().toString(), title: "New Chat", messages: [] };
 threads.unshift(newThread);
 activeThreadId = newThread.id;
 saveThreads();
 renderSidebar();
 renderActiveChat();
 sidebar.classList.remove('open');
 }
 function deleteThread(id, e) {
 e.stopPropagation();
 threads = threads.filter(t => t.id !== id);
 if (threads.length === 0) { createThread(); return; }
 if (activeThreadId === id) { activeThreadId = threads[0].id; }
 saveThreads();
 renderSidebar();
 renderActiveChat();
 }
 function switchThread(id) {
 activeThreadId = id;
 renderSidebar();
 renderActiveChat();
 sidebar.classList.remove('open');
 }
 function renderSidebar() {
 threadList.innerHTML = '';
 threads.forEach(thread => {
 const item = document.createElement('div');
 item.className = `thread-item ${thread.id === activeThreadId ? 'active' : ''}`;
 item.onclick = () => switchThread(thread.id);
 const titleSpan = document.createElement('span');
 titleSpan.className = 'thread-title';
 titleSpan.textContent = thread.title;
 const delBtn = document.createElement('button');
 delBtn.className = 'del-btn';
 delBtn.textContent = '×';
 delBtn.onclick = (e) => deleteThread(thread.id, e);
 item.appendChild(titleSpan);
 item.appendChild(delBtn);
 threadList.appendChild(item);
 });
 }
 function renderMarkdown(text) {
 return DOMPurify.sanitize(marked.parse(text));
 }
 function appendMessage(role, text) {
 const div = document.createElement('div');
 div.className = `msg ${role}`;
 div.innerHTML = role === 'user' ? DOMPurify.sanitize(text) : renderMarkdown(text);
 chatBox.appendChild(div);
 chatBox.scrollTop = chatBox.scrollHeight;
 return div;
 }
 function renderActiveChat() {
 const current = threads.find(t => t.id === activeThreadId);
 if (!current) return;
 chatTitle.textContent = current.title;
 chatBox.innerHTML = '';
 current.messages.forEach(msg => appendMessage(msg.role, msg.parts[0].text));
 }
 menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
 newChatBtn.addEventListener('click', createThread);
 if (threads.length === 0) { createThread(); }
 else { renderSidebar(); renderActiveChat(); }
 chatForm.addEventListener('submit', async (e) => {
 e.preventDefault();
 const text = userInput.value.trim();
 if (!text) return;
 const currentThread = threads.find(t => t.id === activeThreadId);
 if (!currentThread) return;
 userInput.value = '';
 sendBtn.disabled = true;
 if (currentThread.messages.length === 0) {
 currentThread.title = text.slice(0, 32) + (text.length > 32 ? "..." : "");
 chatTitle.textContent = currentThread.title;
 renderSidebar();
 }
 appendMessage('user', text);
 currentThread.messages.push({ role: "user", parts: [{ text }] });
 saveThreads();
 const aiDiv = appendMessage('model', '...');
 let fullReply = "";
 try {
 const response = await fetch(WORKER_URL, {
 method: "POST",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify({ contents: currentThread.messages })
 });
 const reader = response.body.getReader();
 const decoder = new TextDecoder();
 let buffer = "";
 while (true) {
 const { done, value } = await reader.read();
 if (done) break;
 buffer += decoder.decode(value, { stream: true });
 const lines = buffer.split("");
 buffer = lines.pop();
 for (const line of lines) {
 if (line.startsWith("data: ")) {
 const jsonStr = line.slice(6).trim();
 if (!jsonStr || jsonStr === "[DONE]") continue;
 try {
 const parsed = JSON.parse(jsonStr);
 const chunkText = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
 fullReply += chunkText;
 aiDiv.innerHTML = renderMarkdown(fullReply);
 chatBox.scrollTop = chatBox.scrollHeight;
 } catch (parseErr) {}
 }
 }
 }
 currentThread.messages.push({ role: "model", parts: [{ text: fullReply }] });
 saveThreads();
 } catch (err) {
 aiDiv.textContent = "Error: Unable to stream response.";
 } finally {
 sendBtn.disabled = false;
 }
 });
 </script>
</body>
</html>
